<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | 合同会社TOGO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a2744">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans JP','Yu Gothic',sans-serif;
  background:linear-gradient(160deg,#0f1a2e 0%,#1a2744 40%,#2b4c7e 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:#fff;padding:24px;
}
.card{
  max-width:560px;width:100%;text-align:center;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(184,150,90,.25);
  border-radius:3px;padding:clamp(40px,6vw,64px) clamp(24px,5vw,48px);
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#b8965a,transparent);
}
.code{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:96px;font-weight:700;color:#d4b07a;line-height:1;letter-spacing:6px;margin-bottom:8px}
.label{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:13px;letter-spacing:5px;color:#b8965a;text-transform:uppercase;margin-bottom:24px}
.divider{width:40px;height:2px;background:#b8965a;margin:0 auto 28px}
h1{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:clamp(20px,3.5vw,26px);font-weight:700;color:#fff;margin-bottom:24px;line-height:1.6}
p{font-size:14px;color:rgba(255,255,255,.7);line-height:2;margin-bottom:16px}
.btn{display:inline-block;margin-top:24px;padding:14px 40px;border:1px solid #b8965a;color:#d4b07a;text-decoration:none;font-size:13px;letter-spacing:2px;transition:all .3s;background:transparent}
.btn:hover{background:#b8965a;color:#fff}
</style>
</head>
<body>
<main class="card">
  <div class="code">404</div>
  <p class="label">Page Not Found</p>
  <div class="divider"></div>
  <h1>お探しのページが見つかりません</h1>
  <p>URL が変更されたか、ページが削除された可能性があります。<br>お手数ですがトップページよりお探しください。</p>
  <a href="/" class="btn">トップページへ戻る</a>
</main>
</body>
</html>
